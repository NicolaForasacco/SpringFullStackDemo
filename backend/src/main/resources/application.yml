server:
  port: 8080

spring:
  application:
    name: fullstack-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

# Configurazione Sicurezza JWT
security:
  jwt:
    secret: ${JWT_SECRET:chiave_segreta_molto_lunga_per_firmare_i_jwt_con_hs256_almeno_256bit}
    expiration-ms: 86400000 # 24 ore
