server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Routing Frontend Angular (Single Page Application)
    # Se il file richiesto non esiste fisicamente (es. /login o /products),
    # Nginx rimanda a index.html per far gestire la rotta al router Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy verso il Backend Spring Boot
    # Tutte le chiamate che iniziano con /api/ vengono girate direttamente
    # al container "backend" sulla porta 8080 all'interno della rete Docker
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Disabilita log per favicon e robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
