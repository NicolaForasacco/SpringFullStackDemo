<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4 p-md-5">

          <div class="text-center mb-4">
            <div class="display-6 fw-bold text-primary mb-2">
              <i class="bi bi-shield-lock-fill"></i> Enterprise Portal
            </div>
            <p class="text-muted">
              {{ isRegister() ? 'Crea un nuovo account' : 'Accedi con le tue credenziali' }}
            </p>
          </div>

          <!-- Alert Errore -->
          @if (errorMessage()) {
            <div class="alert alert-danger py-2" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ errorMessage() }}
            </div>
          }

          <form (ngSubmit)="onSubmit()">

            @if (isRegister()) {
              <div class="mb-3">
                <label class="form-label">Nome Completo</label>
                <input type="text" class="form-control" [(ngModel)]="fullName" name="fullName" required placeholder="Mario Rossi">
              </div>
            }

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" [(ngModel)]="email" name="email" required placeholder="nome@esempio.it">
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" [(ngModel)]="password" name="password" required placeholder="••••••••">
              <div class="form-text">La password verrà cifrata sul server con <strong>Argon2id</strong>.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" [disabled]="loading()">
              @if (loading()) {
                <span class="spinner-border spinner-border-sm me-2" role="status"></span>
              }
              {{ isRegister() ? 'Registrati' : 'Accedi' }}
            </button>
          </form>

          <hr class="my-4">

          <div class="text-center">
            <button type="button" class="btn btn-link text-decoration-none" (click)="toggleMode()">
              {{ isRegister() ? 'Hai già un account? Accedi qui' : 'Non hai un account? Registrati' }}
            </button>
          </div>

          <!-- Credenziali Demo Rapide -->
          <div class="mt-3 p-3 bg-light rounded text-center small border">
            <span class="text-muted d-block mb-1">Vuoi provare l'utente di test già pronto?</span>
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="fillAdminCredentials()">
              <i class="bi bi-lightning-fill text-warning"></i> Inserisci: admin&#64;example.com / Admin123!
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
